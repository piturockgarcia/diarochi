<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DiaroChi</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}#app{position:relative;width:100%;height:100%;background:#000;overflow:hidden}video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.screen{position:absolute;inset:0}.hidden{display:none!important}#play{position:absolute;left:50%;top:78%;transform:translate(-50%,-50%);min-width:150px;padding:16px 44px;border:1px solid rgba(255,255,255,.55);border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:700 24px system-ui;letter-spacing:2px;text-shadow:0 1px 3px #000;cursor:pointer;backdrop-filter:blur(3px)}#play:active{transform:translate(-50%,-50%) scale(.96)}#game{position:absolute;inset:0}.hit{position:absolute;width:150px;height:150px;transform:translate(-50%,-50%);border:0;background:transparent;border-radius:50%;display:none;z-index:5}#ripple{position:fixed;width:32px;height:32px;border:2px solid rgba(255,255,255,.7);border-radius:50%;pointer-events:none;opacity:0;z-index:20}.go{animation:r .5s ease-out}@keyframes r{0%{transform:translate(-50%,-50%) scale(.15);opacity:.75}100%{transform:translate(-50%,-50%) scale(4.2);opacity:0}}
</style>
</head>
<body><main id="app">
<section id="intro" class="screen"><video id="presentation" playsinline preload="auto"></video></section>
<section id="title" class="screen hidden"><video id="titleVideo" playsinline preload="auto"></video><button id="play">PLAY</button></section>
<section id="game" class="hidden"><video id="loop" playsinline muted preload="auto"></video><video id="actionVideo" playsinline preload="auto" class="hidden"></video><button id="hit" class="hit" aria-label="Punto de interacción"></button></section>
<div id="ripple"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const intro=$('intro'),title=$('title'),game=$('game'),presentation=$('presentation'),titleVideo=$('titleVideo'),loop=$('loop'),actionVideo=$('actionVideo'),hit=$('hit'),ripple=$('ripple');
const actions={1:'assets/videos/se_destapa.mp4',2:'assets/videos/luz.mp4',3:'assets/videos/leo_matioli.mp4',4:'assets/videos/suena_cel.mp4',5:'assets/videos/llega_emmi.mp4'};
let step=1,busy=false;

presentation.src='assets/videos/presentacion.mp4';
titleVideo.src='assets/videos/titulo.mp4';
loop.src='assets/videos/durmiendo.mp4';
loop.loop=true;

function showTitle(){intro.classList.add('hidden');title.classList.remove('hidden');titleVideo.currentTime=0;titleVideo.play().catch(()=>{});}
presentation.addEventListener('ended',showTitle);
presentation.addEventListener('error',showTitle);
presentation.play().catch(()=>{});

titleVideo.addEventListener('ended',()=>{titleVideo.currentTime=0;titleVideo.play().catch(()=>{});});

$('play').addEventListener('pointerup',()=>{
  title.classList.add('hidden');game.classList.remove('hidden');
  step=1;busy=false;setHitPosition(1);hit.style.display='block';
  loop.currentTime=0;loop.play().catch(()=>{});
});

// Posiciones provisionales. Están en porcentajes para que funcionen en cualquier celular horizontal.
const points={
  1:{x:78,y:55},
  2:{x:63,y:42},
  3:{x:25,y:55},
  4:{x:50,y:35},
  5:{x:88,y:45}
};
function setHitPosition(n){const p=points[n];if(!p)return;hit.style.left=p.x+'%';hit.style.top=p.y+'%';}
function rippleAt(e){ripple.style.left=e.clientX+'px';ripple.style.top=e.clientY+'px';ripple.classList.remove('go');void ripple.offsetWidth;ripple.classList.add('go');}
function trigger(e){
  if(busy||!actions[step])return;
  rippleAt(e);busy=true;hit.style.display='none';loop.pause();
  actionVideo.src=actions[step];actionVideo.classList.remove('hidden');actionVideo.currentTime=0;actionVideo.play().catch(()=>{});
}
hit.addEventListener('pointerup',trigger);

actionVideo.addEventListener('ended',()=>{
  actionVideo.pause();actionVideo.classList.add('hidden');actionVideo.removeAttribute('src');actionVideo.load();
  loop.currentTime=0;loop.play().catch(()=>{});
  step++;
  busy=false;
  if(actions[step]){setHitPosition(step);hit.style.display='block';}
});
</script></body></html>
