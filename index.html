<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>DiaroChi</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}#app{position:relative;width:100%;height:100%;overflow:hidden;background:#000}video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.screen{position:absolute;inset:0}.hidden{display:none!important}#play{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);min-width:160px;padding:15px 46px;border:1px solid #fff;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;font:700 24px system-ui;letter-spacing:2px;z-index:5}.marker{position:absolute;width:100px;height:100px;transform:translate(-50%,-50%);display:none;z-index:10;border:5px solid #fff;border-radius:50%;background:rgba(220,0,0,.88);color:#fff;font:900 42px system-ui;text-align:center;line-height:90px;text-shadow:0 2px 4px #000;pointer-events:none;box-shadow:0 0 0 8px rgba(255,255,255,.8),0 4px 18px rgba(0,0,0,.9)}.marker.active{display:block;animation:pulse 1s infinite}.marker.done{display:block;opacity:.35;transform:translate(-50%,-50%) scale(.72)}.label{position:absolute;transform:translate(-50%,45px);display:none;z-index:11;background:#000;color:#fff;padding:6px 10px;border-radius:8px;font:bold 18px system-ui;white-space:nowrap;pointer-events:none;border:2px solid #fff}.label.active{display:block}.label.done{display:none}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.12)}}#hit{position:absolute;width:180px;height:180px;transform:translate(-50%,-50%);border:0;background:transparent;border-radius:50%;display:none;z-index:9}#ripple{position:fixed;width:32px;height:32px;border:2px solid #fff;border-radius:50%;pointer-events:none;opacity:0;z-index:20}.go{animation:r .5s ease-out}@keyframes r{to{transform:translate(-50%,-50%) scale(4);opacity:0}}
</style></head><body><main id="app">
<section id="intro" class="screen"><video id="presentation" playsinline muted preload="auto"></video></section>
<section id="title" class="screen hidden"><video id="titleVideo" playsinline muted preload="auto"></video><button id="play">PLAY</button></section>
<section id="game" class="hidden"><video id="loop" playsinline muted preload="auto"></video><video id="actionVideo" playsinline muted preload="auto" class="hidden"></video><button id="hit" aria-label="Punto de interacción"></button>
<div id="m1" class="marker">1</div><div id="m2" class="marker">2</div><div id="m3" class="marker">3</div><div id="m4" class="marker">4</div><div id="m5" class="marker">5</div>
<div id="l1" class="label">CAMA</div><div id="l2" class="label">LUZ</div><div id="l3" class="label">TELE</div><div id="l4" class="label">CELULAR</div><div id="l5" class="label">ABAJO DERECHA</div></section><div id="ripple"></div></main>
<script>
const $=id=>document.getElementById(id),intro=$('intro'),title=$('title'),game=$('game'),presentation=$('presentation'),titleVideo=$('titleVideo'),loop=$('loop'),actionVideo=$('actionVideo'),hit=$('hit'),ripple=$('ripple');
const markers=[null,$('m1'),$('m2'),$('m3'),$('m4'),$('m5')],labels=[null,$('l1'),$('l2'),$('l3'),$('l4'),$('l5')];
const actions={1:'assets/videos/se_destapa.mp4',2:'assets/videos/luz.mp4',3:'assets/videos/leo_matioli.mp4',4:'assets/videos/suena_cel.mp4',5:'assets/videos/llega_emmi.mp4'};let step=1,busy=false;
presentation.src='assets/videos/presentacion.mp4';titleVideo.src='assets/videos/titulo.mp4';loop.src='assets/videos/durmiendo.mp4';loop.loop=true;
// Coordenadas provisionales, expresadas como porcentaje del área horizontal.
const points={1:{x:78,y:55},2:{x:63,y:42},3:{x:25,y:55},4:{x:50,y:35},5:{x:88,y:82}};
function setPoint(n){const p=points[n];if(!p)return;hit.style.left=p.x+'%';hit.style.top=p.y+'%';markers[n].style.left=p.x+'%';markers[n].style.top=p.y+'%';labels[n].style.left=p.x+'%';labels[n].style.top=p.y+'%';markers[n].classList.add('active');labels[n].classList.add('active');}
function reset(){for(let i=1;i<=5;i++){markers[i].className='marker';labels[i].className='label';}}
function showTitle(){intro.classList.add('hidden');title.classList.remove('hidden');titleVideo.currentTime=0;titleVideo.play().catch(()=>{});}presentation.addEventListener('ended',showTitle);presentation.addEventListener('error',showTitle);presentation.play().catch(()=>{});titleVideo.addEventListener('ended',()=>{titleVideo.currentTime=0;titleVideo.play().catch(()=>{});});
$('play').addEventListener('pointerup',()=>{title.classList.add('hidden');game.classList.remove('hidden');step=1;busy=false;reset();setPoint(1);hit.style.display='block';loop.currentTime=0;loop.play().catch(()=>{});});
function rippleAt(e){ripple.style.left=e.clientX+'px';ripple.style.top=e.clientY+'px';ripple.classList.remove('go');void ripple.offsetWidth;ripple.classList.add('go');}
function trigger(e){if(busy||!actions[step])return;rippleAt(e);busy=true;hit.style.display='none';markers[step].classList.remove('active');markers[step].classList.add('done');labels[step].classList.remove('active');loop.pause();actionVideo.src=actions[step];actionVideo.classList.remove('hidden');actionVideo.currentTime=0;actionVideo.play().catch(()=>{});}
hit.addEventListener('pointerup',trigger);
actionVideo.addEventListener('ended',()=>{actionVideo.pause();actionVideo.classList.add('hidden');actionVideo.removeAttribute('src');actionVideo.load();loop.currentTime=0;loop.play().catch(()=>{});step++;busy=false;if(actions[step]){setPoint(step);hit.style.display='block';}});
</script></body></html>
