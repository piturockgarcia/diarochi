<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>DiaroChi</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}#app{position:relative;width:100%;height:100%;overflow:hidden;background:#000}video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.screen{position:absolute;inset:0}.hidden{display:none!important}#play{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);min-width:160px;padding:15px 46px;border:2px solid #fff;border-radius:999px;background:#000;color:#fff;font:700 24px system-ui;z-index:20}.marker{position:absolute;width:118px;height:118px;transform:translate(-50%,-50%);display:none;z-index:30;border:5px solid #fff;border-radius:50%;background:rgba(255,255,255,.96);color:#111;font:900 62px system-ui;text-align:center;line-height:108px;pointer-events:none;box-shadow:0 0 0 8px rgba(255,80,80,.9),0 5px 25px #000}.marker.active{display:block;animation:pulse .8s infinite}.label{position:absolute;transform:translate(-50%,75px);display:none;z-index:31;background:rgba(0,0,0,.92);color:#fff;padding:9px 15px;border:3px solid #fff;border-radius:12px;font:bold 24px Arial;white-space:nowrap;pointer-events:none;box-shadow:0 3px 12px #000}.label.active{display:block}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.12)}}#hit{position:absolute;width:200px;height:200px;transform:translate(-50%,-50%);border:0;background:transparent;border-radius:50%;display:none;z-index:25}#ripple{position:fixed;width:35px;height:35px;border:3px solid #fff;border-radius:50%;pointer-events:none;opacity:0;z-index:50}.go{animation:r .5s ease-out}@keyframes r{to{transform:translate(-50%,-50%) scale(5);opacity:0}}</style></head><body><main id="app"><section id="intro" class="screen"><video id="presentation" playsinline muted preload="auto"></video></section><section id="title" class="screen hidden"><video id="titleVideo" playsinline muted preload="auto"></video><button id="play">PLAY</button></section><section id="game" class="hidden"><video id="loop" playsinline muted preload="auto"></video><video id="actionVideo" playsinline muted preload="auto" class="hidden"></video><button id="hit"></button><div id="m1" class="marker">🛏️</div><div id="m2" class="marker">💡</div><div id="m3" class="marker">📺</div><div id="m4" class="marker">📱</div><div id="m5" class="marker">👉</div><div id="l1" class="label">PUNTO 1 — CAMA</div><div id="l2" class="label">PUNTO 2 — LUZ</div><div id="l3" class="label">PUNTO 3 — TELE</div><div id="l4" class="label">PUNTO 4 — CELULAR</div><div id="l5" class="label">PUNTO 5 — ABAJO DERECHA</div></section><div id="ripple"></div></main><script>const $=id=>document.getElementById(id),intro=$('intro'),title=$('title'),game=$('game'),presentation=$('presentation'),titleVideo=$('titleVideo'),loop=$('loop'),actionVideo=$('actionVideo'),hit=$('hit'),ripple=$('ripple');const markers=[null,$('m1'),$('m2'),$('m3'),$('m4'),$('m5')],labels=[null,$('l1'),$('l2'),$('l3'),$('l4'),$('l5')];const actions={1:'assets/videos/se_destapa.mp4',2:'assets/videos/luz.mp4',3:'assets/videos/leo_matioli.mp4',4:'assets/videos/suena_cel.mp4',5:'assets/videos/llega_emmi.mp4'};const points={1:{x:78,y:55},2:{x:63,y:42},3:{x:25,y:55},4:{x:50,y:35},5:{x:88,y:82}};let step=1,busy=false;presentation.src='assets/videos/presentacion.mp4';titleVideo.src='assets/videos/titulo.mp4';loop.src='assets/videos/durmiendo.mp4';loop.loop=true;function showTitle(){intro.classList.add('hidden');title.classList.remove('hidden');titleVideo.currentTime=0;titleVideo.play().catch(()=>{})}presentation.addEventListener('ended',showTitle);presentation.addEventListener('error',showTitle);presentation.play().catch(()=>{});titleVideo.addEventListener('ended',()=>{titleVideo.currentTime=0;titleVideo.play().catch(()=>{})});function reset(){for(let i=1;i<=5;i++){markers[i].className='marker';labels[i].className='label'}}function setPoint(n){const p=points[n];hit.style.left=p.x+'%';hit.style.top=p.y+'%';markers[n].style.left=p.x+'%';markers[n].style.top=p.y+'%';labels[n].style.left=p.x+'%';labels[n].style.top=(p.y+7)+'%';markers[n].classList.add('active');labels[n].classList.add('active')}$('play').addEventListener('pointerup',()=>{title.classList.add('hidden');game.classList.remove('hidden');step=1;busy=false;reset();setPoint(1);hit.style.display='block';loop.currentTime=0;loop.play().catch(()=>{})});function rippleAt(e){ripple.style.left=e.clientX+'px';ripple.style.top=e.clientY+'px';ripple.classList.remove('go');void ripple.offsetWidth;ripple.classList.add('go')}hit.addEventListener('pointerup',e=>{if(busy||!actions[step])return;rippleAt(e);busy=true;hit.style.display='none';markers[step].classList.remove('active');labels[step].classList.remove('active');loop.pause();actionVideo.src=actions[step];actionVideo.classList.remove('hidden');actionVideo.currentTime=0;actionVideo.play().catch(()=>{})});actionVideo.addEventListener('ended',()=>{actionVideo.classList.add('hidden');actionVideo.removeAttribute('src');actionVideo.load();loop.currentTime=0;loop.play().catch(()=>{});step++;busy=false;if(actions[step]){setPoint(step);hit.style.display='block'}});</script></body></html>
